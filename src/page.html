<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfbf8">
  <meta name="description" content="Stretch a transparent rainbow jelly, shake coconuts from palms, and explore three tropical islands with touch-friendly physics and playful music.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Blob Island">
  <title>Blob Island</title>
  <script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
  </script>
  <style>
  :root {
    color-scheme: light;
    --cp-bg: #f7f4ef;
    --cp-bg-elevated: #fcfbf8;
    --cp-surface: #ffffff;
    --cp-surface-soft: #f5f5f5;
    --cp-border: #dedede;
    --cp-border-strong: #919191;
    --cp-text: #242424;
    --cp-text-muted: #5c5c5c;
    --cp-text-soft: #6f6f6f;
    --cp-accent: #b11f4b;
    --cp-accent-hover: #9a1a41;
    --cp-accent-soft: rgba(177, 31, 75, 0.08);
    --cp-accent-fg: #ffffff;
    --cp-success: #16a34a;
    --cp-danger: #dc2626;
    --cp-warning: #f59e0b;
    --cp-link: #0078d4;
    --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
    --cp-overlay: rgba(255, 255, 255, 0.8);
    --cp-panel: rgba(255, 255, 255, 0.86);
    --cp-panel-strong: rgba(255, 255, 255, 0.96);
    --cp-sheen: rgba(255, 255, 255, 0.55);
    --cp-highlight: rgba(177, 31, 75, 0.12);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --cp-bg: #3d3b3a;
    --cp-bg-elevated: #343231;
    --cp-surface: #292929;
    --cp-surface-soft: #2e2e2e;
    --cp-border: #474747;
    --cp-border-strong: #5f5f5f;
    --cp-text: #dedede;
    --cp-text-muted: #919191;
    --cp-text-soft: #b0b0b0;
    --cp-accent: #fd8ea1;
    --cp-accent-hover: #fb7b91;
    --cp-accent-soft: rgba(253, 142, 161, 0.14);
    --cp-accent-fg: #1a1a1a;
    --cp-success: #4ade80;
    --cp-danger: #f87171;
    --cp-warning: #fbbf24;
    --cp-link: #4da6ff;
    --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
    --cp-overlay: rgba(41, 41, 41, 0.88);
    --cp-panel: rgba(41, 41, 41, 0.72);
    --cp-panel-strong: rgba(41, 41, 41, 0.96);
    --cp-sheen: rgba(255, 255, 255, 0.04);
    --cp-highlight: rgba(253, 142, 161, 0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--cp-bg); color: var(--cp-text); font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0; }
  button { font: inherit; color: inherit; }
  #island { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; }
  #world { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; outline: none; }
  #world:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: -5px; }
  .masthead { position: absolute; inset: max(24px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) auto max(28px, env(safe-area-inset-left)); display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; pointer-events: none; }
  .identity { display: flex; align-items: center; gap: 12px; }
  .mark { width: 43px; height: 43px; flex: 0 0 43px; color: var(--cp-accent); }
  .identity h1 { font-size: 27px; line-height: 1.05; font-weight: 750; margin: 0; color: var(--cp-text); }
  .edition { margin-top: 7px; font-size: 10px; font-weight: 650; color: var(--cp-text-muted); }
  .controls { display: flex; align-items: center; gap: 7px; pointer-events: auto; }
  .icon-button { position: relative; display: grid; place-items: center; width: 46px; height: 46px; padding: 0; flex: 0 0 46px; background: var(--cp-panel-strong); border: 1px solid var(--cp-border); border-radius: 10px; cursor: pointer; transition: background 150ms, transform 150ms; touch-action: manipulation; }
  .icon-button svg { width: 20px; height: 20px; stroke-width: 1.65; pointer-events: none; }
  .icon-button:hover { background: var(--cp-bg-elevated); }
  .icon-button:active { transform: scale(.94); }
  .icon-button:disabled { opacity: .45; cursor: default; transform: none; }
  .icon-button:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 3px; }
  .icon-button[aria-pressed="true"] { background: var(--cp-accent-soft); color: var(--cp-accent); border-color: var(--cp-accent); }
  .icon-button::after { content: attr(aria-label); position: absolute; top: calc(100% + 10px); right: 0; width: max-content; max-width: 190px; padding: 7px 10px; background: var(--cp-panel-strong); border: 1px solid var(--cp-border); border-radius: 6px; font-size: 12px; color: var(--cp-text); opacity: 0; pointer-events: none; transition: opacity 120ms; }
  .icon-button:focus-visible::after { opacity: 1; }
  @media (hover: hover) { .icon-button:hover::after { opacity: 1; } }
  .divider { width: 1px; height: 24px; background: var(--cp-border-strong); opacity: .4; margin: 0 3px; }
  .map-switcher { position: absolute; left: 50%; top: max(98px, calc(env(safe-area-inset-top) + 70px)); transform: translateX(-50%); display: flex; gap: 3px; padding: 3px; max-width: calc(100% - 28px); background: var(--cp-panel-strong); border: 1px solid var(--cp-border); border-radius: 10px; }
  .map-switcher button { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px; min-width: 108px; padding: 6px 12px; background: transparent; border: 0; border-radius: 6px; font-size: 12px; font-weight: 650; cursor: pointer; touch-action: manipulation; }
  .map-switcher button[aria-pressed="true"] { background: var(--cp-accent-soft); color: var(--cp-accent); }
  .map-switcher button:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: -2px; }
  .map-switcher canvas { width: 25px; height: 25px; flex: 0 0 25px; border-radius: 4px; }
  .island-caption { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: max(28px, env(safe-area-inset-left)); pointer-events: none; display: flex; flex-direction: column; gap: 8px; }
  .island-caption strong { font-size: 13px; font-weight: 650; }
  .island-caption span { color: var(--cp-text-muted); font-size: 10px; font-weight: 600; }
  .music-credit { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; font-size: 10px; color: var(--cp-text-muted); white-space: nowrap; }
  .music-credit a { color: inherit; text-underline-offset: 3px; }
  .weather { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); right: max(28px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; pointer-events: none; }
  .weather svg { width: 18px; height: 18px; }
  .weather .line { height: 16px; width: 1px; background: var(--cp-text-soft); opacity: .5; }
  html[data-theme="dark"] .island-caption, html[data-theme="dark"] .weather { color: var(--cp-bg-elevated); }
  html[data-theme="dark"] .island-caption span { color: var(--cp-bg); }
  html[data-theme="dark"] .weather .line { background: var(--cp-bg); }
  html[data-theme="dark"] .music-credit { color: var(--cp-bg); }
  .pause-state { position: absolute; top: 160px; left: 50%; transform: translateX(-50%); padding: 9px 17px; background: var(--cp-panel-strong); border: 1px solid var(--cp-border); border-radius: 10px; font-size: 13px; pointer-events: none; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  #error { position: absolute; inset: auto 24px 90px; background: var(--cp-panel-strong); padding: 20px; border: 1px solid var(--cp-danger); border-radius: 10px; max-width: 460px; margin: auto; font-size: 14px; }
  @media (max-width: 760px) {
    .masthead { inset: max(17px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) auto max(16px, env(safe-area-inset-left)); gap: 12px; }
    .identity { gap: 7px; }
    .identity h1 { font-size: 19px; }
    .mark { width: 32px; height: 36px; flex-basis: 32px; }
    .edition { font-size: 8px; margin-top: 5px; }
    .controls { gap: 5px; }
    .icon-button { width: 44px; height: 44px; flex-basis: 44px; }
    .divider { display: none; }
    #fullscreen { display: none; }
    .map-switcher { top: max(82px, calc(env(safe-area-inset-top) + 64px)); gap: 2px; }
    .map-switcher button { min-width: 96px; padding: 6px 8px; gap: 5px; font-size: 11px; }
    .map-switcher canvas { width: 20px; height: 20px; flex-basis: 20px; }
    .island-caption { left: max(18px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); }
    .weather { right: max(18px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); }
    .weather .tide, .weather .line { display: none; }
    .island-caption, .weather { bottom: max(46px, calc(env(safe-area-inset-bottom) + 26px)); }
    .music-credit { bottom: max(15px, env(safe-area-inset-bottom)); font-size: 9px; }
  }
  @media (max-width: 440px) { .mark { display: none; } .identity h1 { font-size: 18px; } .edition { max-width: 125px; font-size: 7px; } .identity { padding-top: 5px; } }
  @media (max-width: 360px) { .controls { gap: 3px; } .identity h1 { font-size: 16px; } .map-switcher button { min-width: 89px; padding: 6px; } }
  @media (max-height: 480px) { .masthead { top: 12px; } .edition, .island-caption, .weather { display: none; } .map-switcher { top: 70px; } .pause-state { top: 125px; } }
  @media (prefers-reduced-motion: reduce) { .icon-button { transition: none; } }
  </style>
</head>
<body>
  <main id="island" aria-label="Blob Island physics playground">
    <canvas id="world" tabindex="0" aria-label="A tropical island with stretchy rainbow jelly, toys, and a coconut palm. Drag with touch or mouse. Pull two fingers apart to stretch. Grab or crash into the palm to drop coconuts. Arrow keys move, Space pauses, R resets the current island, and M toggles sound.">Your browser needs Canvas support to play Blob Island.</canvas>
    <header class="masthead">
      <div class="identity">
        <canvas class="mark" id="brand-mark" width="96" height="96" aria-hidden="true"></canvas>
        <div><h1>Blob Island</h1><div class="edition">A LITTLE PIECE OF PARADISE</div></div>
      </div>
      <nav class="controls" aria-label="Game controls">
        <button type="button" class="icon-button" id="music" aria-label="Play music" aria-pressed="false"></button>
        <button type="button" class="icon-button" id="sound" aria-label="Turn sound on" aria-pressed="false"></button>
        <button type="button" class="icon-button" id="pause" aria-label="Pause" aria-pressed="false"></button>
        <span class="divider" aria-hidden="true"></span>
        <button type="button" class="icon-button" id="reset" aria-label="Reset island"></button>
        <button type="button" class="icon-button" id="fullscreen" aria-label="Enter full screen" hidden></button>
      </nav>
    </header>
    <nav class="map-switcher" aria-label="Island areas">
      <button type="button" data-map="lagoon" aria-pressed="true"><canvas width="64" height="64" aria-hidden="true"></canvas>Little Lagoon</button>
      <button type="button" data-map="pools" aria-pressed="false"><canvas width="64" height="64" aria-hidden="true"></canvas>Tide Pools</button>
      <button type="button" data-map="sunset" aria-pressed="false"><canvas width="64" height="64" aria-hidden="true"></canvas>Sunset Cove</button>
    </nav>
    <div class="pause-state" id="pause-state" hidden>Island time, paused.</div>
    <div class="island-caption" aria-hidden="true"><strong id="place-name">Little Lagoon</strong><span id="place-caption">NO. 01 / THE QUIET COAST</span></div>
    <div class="weather" aria-hidden="true"><span id="sun-icon"></span><span id="temperature">28&deg;</span><span class="line"></span><span class="tide">LOW TIDE</span></div>
    <div class="music-credit"><a href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1400037" target="_blank" rel="noopener noreferrer">Carefree / Kevin MacLeod</a><span aria-hidden="true">&middot;</span><a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></div>
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
    <div id="error" role="alert" hidden></div>
    <noscript><p>JavaScript is required to play this game.</p></noscript>
  </main>
  <script>/* BLOB_ISLAND_BUNDLE */</script>
</body>
</html>
